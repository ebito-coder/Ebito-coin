<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07120c">

<title>EBiTO Coin</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#06100b;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding-bottom:90px;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 16px 8px;
}

.logo{
  font-size:25px;
  font-weight:900;
  color:#62ff9b;
}

.logo span{
  color:#fff;
}

.user-pill{
  background:#11241a;
  border:1px solid #1e402d;
  padding:8px 12px;
  border-radius:20px;
  font-size:12px;
  max-width:170px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.page{
  display:none;
  padding:12px 15px 20px;
}

.page.active{
  display:block;
}

.balance-card{
  position:relative;
  overflow:hidden;
  text-align:center;
  padding:25px 18px;
  border-radius:25px;
  background:
    radial-gradient(circle at top,#185c36,#0d281a 45%,#091810);
  border:1px solid #286340;
  box-shadow:0 12px 40px #0007;
}

.balance-card:after{
  content:"";
  position:absolute;
  width:160px;
  height:160px;
  right:-70px;
  top:-70px;
  border-radius:50%;
  background:#63ff9b18;
}

.small-title{
  color:#91aa9a;
  font-size:12px;
  font-weight:700;
  letter-spacing:.5px;
}

.balance{
  margin:7px 0;
  font-size:42px;
  line-height:1;
  font-weight:900;
}

.symbol{
  color:#63ff9b;
  font-size:20px;
}

.mining-rate{
  color:#9ab0a1;
  font-size:12px;
}

.tap-section{
  text-align:center;
  padding:25px 0 12px;
}

.coin{
  width:190px;
  height:190px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:31px;
  font-weight:900;
  color:#052111;
  background:
    radial-gradient(circle at 32% 28%,#d7ffe4 0,#83ffad 25%,#39d875 54%,#087333 100%);
  box-shadow:
    0 0 0 9px #63ff9b0b,
    0 0 50px #4cff9270;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
  transition:transform .07s;
}

.coin:active{
  transform:scale(.93);
}

.energy{
  margin-top:18px;
  font-size:13px;
  color:#a3b6aa;
}

.progress{
  width:100%;
  height:8px;
  margin-top:8px;
  border-radius:20px;
  overflow:hidden;
  background:#16271d;
}

.progress-bar{
  height:100%;
  background:#63ff9b;
  border-radius:20px;
  transition:.2s;
}

.section-title{
  margin:21px 0 11px;
  font-size:18px;
  font-weight:900;
}

.card{
  margin-bottom:12px;
  padding:16px;
  border-radius:18px;
  background:#0c1b13;
  border:1px solid #1d3928;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.muted{
  color:#82978a;
  font-size:12px;
}

.btn{
  min-height:42px;
  padding:10px 15px;
  border-radius:13px;
  background:#63ff9b;
  color:#052111;
  font-weight:900;
}

.btn.dark{
  background:#173124;
  color:#fff;
}

.btn.red{
  background:#752833;
  color:#fff;
}

.btn.blue{
  background:#377dff;
  color:#fff;
}

.btn.full{
  width:100%;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.upgrade{
  display:flex;
  align-items:center;
  gap:12px;
}

.upgrade-icon{
  width:50px;
  height:50px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:15px;
  background:#173625;
  font-size:24px;
}

.upgrade-info{
  flex:1;
}

.upgrade-name{
  font-weight:900;
}

.upgrade-level{
  margin-top:4px;
  color:#819589;
  font-size:11px;
}

.nav{
  position:fixed;
  z-index:50;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  max-width:520px;
  display:flex;
  justify-content:space-around;
  padding:9px 4px calc(9px + env(safe-area-inset-bottom));
  background:#08130d;
  border-top:1px solid #1b3325;
}

.nav button{
  flex:1;
  background:none;
  color:#72867a;
  font-size:10px;
}

.nav button.active{
  color:#63ff9b;
}

.nav-icon{
  display:block;
  margin-bottom:3px;
  font-size:20px;
}

.cipher{
  text-align:center;
}

.morse{
  min-height:60px;
  margin:16px 0;
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  background:#06100b;
  color:#63ff9b;
  font-size:24px;
  letter-spacing:5px;
